server {
    listen 80;
    server_name _;

    # Límite de subida (fotos del OCR)
    client_max_body_size 15M;

    # Compresión
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API y de los archivos subidos hacia el backend.
    # En docker-compose.prod el backend no está expuesto al exterior, solo en la red interna.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html: siempre la versión más nueva
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre: cache de 1 año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
